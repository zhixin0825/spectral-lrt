name: Compile current spectral LRT manuscript

on:
  push:
    branches: [main]
    paths:
      - "paper/current/main.tex"
      - "paper/current/reference.bib"
      - "paper/current/figures/**"
      - ".github/workflows/compile-current-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-current-spectral-manuscript
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out manuscript source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Compile manuscript and references
        working-directory: paper/current
        shell: bash
        run: |
          set -o pipefail
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error main.tex | tee compile-output.txt
          bibtex main | tee -a compile-output.txt
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error main.tex | tee -a compile-output.txt
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error main.tex | tee -a compile-output.txt
          test -s main.pdf
          cp main.pdf manuscript.pdf
          cp main.bbl manuscript.bbl
          if grep -E 'undefined references|Citation .* undefined|Reference .* undefined' main.log; then
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile("latex-source.zip", "w", compression=ZIP_DEFLATED) as archive:
              for name in ["main.tex", "reference.bib"]:
                  archive.write(name, name)
              for path in sorted(Path("figures").rglob("*")):
                  if path.is_file():
                      archive.write(path, path.as_posix())
          PY
          sha256sum main.tex reference.bib figures/initialization_failure_repair.pdf main.pdf manuscript.pdf latex-source.zip > BUILD_SHA256SUMS.txt
      - name: Record build provenance
        env:
          BUILD_SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("paper/current/BUILD.txt").write_text(
              "Compiled research manuscript.\n"
              "Entry point: paper/current/main.tex\n"
              "Bibliography: paper/current/reference.bib\n"
              "Source commit: " + os.environ["BUILD_SOURCE_SHA"] + "\n"
              "Build run: " + os.environ["BUILD_RUN_URL"] + "\n",
              encoding="utf-8")
          PY
      - name: Record compiler failure
        if: failure()
        run: |
          if test -f paper/current/compile-output.txt; then
            tail -n 140 paper/current/compile-output.txt > paper/current/BUILD_FAILURE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper/current/BUILD_FAILURE.txt
            if ! git diff --cached --quiet; then
              git commit -m "Record current manuscript compilation diagnostics"
              git push origin HEAD:main
            fi
          fi
      - name: Publish compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/current/main.pdf paper/current/main.bbl paper/current/manuscript.pdf paper/current/manuscript.bbl paper/current/latex-source.zip paper/current/BUILD.txt paper/current/BUILD_SHA256SUMS.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Compile current spectral likelihood manuscript"
          git push origin HEAD:main
