name: Compile oracle-risk scaling report
on:
  push:
    branches: [main]
    paths:
      - "experiments/20261027_oracle_scaling/main.tex"
      - "experiments/20261027_oracle_scaling/section5.tex"
      - ".github/workflows/compile-oracle-scaling.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: compile-oracle-risk-scaling
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate numerical kernels and archived totals
        working-directory: experiments/20261027_oracle_scaling
        run: |
          node validate.cjs
          node - <<'JS'
          const assert=require("node:assert/strict");
          const rows=require("./per_graph.json"),summary=require("./summary.json");
          assert.equal(rows.length,300);
          assert.equal(new Set(rows.map(r=>r.seed)).size,300);
          for(const s of summary){
            const cell=rows.filter(r=>r.model===s.model&&r.n===s.n);
            assert.equal(cell.length,20);
            const mean=cell.reduce((a,r)=>a+r.risk,0)/20;
            assert.ok(Math.abs(mean-s.risk)<1e-14);
            assert.ok(Math.abs(mean/s.oracleRisk-s.ratio)<1e-12);
            assert.ok(cell.every(r=>!r.fallback&&r.eigenResidual<1e-7));
          }
          console.log("All 300 archived runs and 15 summary conditions agree.");
          JS
      - name: Install LaTeX and PDF rendering tools
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern poppler-utils python3-pil
      - name: Compile and render report
        working-directory: experiments/20261027_oracle_scaling
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error main.tex | tee "build-pass-$pass.txt"
          done
          if grep -E 'undefined references|Citation .* undefined|Reference .* undefined|Overfull' main.log; then
            exit 1
          fi
          cp main.pdf experiment_report.pdf
          mkdir -p qa
          pdftoppm -scale-to 1400 -png experiment_report.pdf qa/page
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          pages=sorted(Path("qa").glob("page-*.png"))
          thumbs=[]
          for index,p in enumerate(pages,1):
              im=Image.open(p).convert("RGB")
              im.thumbnail((650,920))
              tile=Image.new("RGB",(690,970),"#eeeeee")
              tile.paste(im,((690-im.width)//2,30))
              ImageDraw.Draw(tile).text((20,945),f"Page {index}",fill="black")
              thumbs.append(tile)
          cols=2
          sheet=Image.new("RGB",(cols*690,((len(thumbs)+cols-1)//cols)*970),"white")
          for index,im in enumerate(thumbs):
              sheet.paste(im,((index%cols)*690,(index//cols)*970))
          sheet.save("qa/contact.png")
          PY
          pdfinfo experiment_report.pdf > qa/pdfinfo.txt
          sha256sum main.tex section5.tex run_experiment.cjs per_graph.json summary.csv experiment_report.pdf > qa/SHA256SUMS.txt
      - name: Publish report and page renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f experiments/20261027_oracle_scaling/experiment_report.pdf experiments/20261027_oracle_scaling/qa
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compile and render oracle-risk scaling experiment report"
          git push origin HEAD:main
